; Death Timer - Immersive Bleedout settings.
; Read every time you load a save or start a new game: edit, save this file, then load.

[General]

; In-game hours a knocked-out NPC takes to recover on their own (0 = never). Default 6
fRecoverHours = 6.0

; 1: a follower who goes down is dying and must be healed before fDeathTimerSeconds runs out.
; 0: followers are only knocked out and get back up on their own after fRecoverHours, like essential NPCs.
; Default 1
bFollowerDeathTimer = 1

; Seconds (real time) a dying NPC has before they die unless healed: followers (with bFollowerDeathTimer
; on), named NPCs, and generic NPCs if bRescueGenericNPCs is on. At least 10. Default 60
fDeathTimerSeconds = 60.0

; 1: unnamed friendly NPCs, such as guards, soldiers and travellers, can also fall dying and be saved
; instead of dying outright. Large battles (dragon attacks, Civil War sieges) can leave many NPCs dying at
; once and slow those battles down. Default 0
bRescueGenericNPCs = 0

; 1: notifications when an NPC is knocked out or dying, when a follower dies, and when you give a potion.
; Default 1
bAllowNotifications = 1
